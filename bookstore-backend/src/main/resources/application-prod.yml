spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      "[hibernate.format_sql]": false

app:
  swagger:
    enabled: ${APP_SWAGGER_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET}
  auth:
    web:
      cookie-secure: ${AUTH_WEB_COOKIE_SECURE:true}
      cookie-same-site: ${AUTH_WEB_COOKIE_SAME_SITE:None}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  admin:
    seed-enabled: ${APP_ADMIN_SEED_ENABLED:${ADMIN_SEED_ENABLED:false}}
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
    phone: ${ADMIN_PHONE:}
    email: ${ADMIN_EMAIL:}
    last-name: ${ADMIN_LAST_NAME:}
    first-name: ${ADMIN_FIRST_NAME:}
  seed:
    enabled: ${APP_DEMO_SEED_ENABLED:false}
    size: ${APP_SEED_SIZE:50}
    category-count: ${APP_SEED_CATEGORY_COUNT:12}
    default-password: ${APP_DEMO_USER_PASSWORD:${APP_SEED_DEFAULT_PASSWORD:}}
    exit-after-run: false

logging:
  pattern:
    console: "ts=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level correlationId=%X{correlationId:-none} logger=%logger{36} msg=%msg%n"
