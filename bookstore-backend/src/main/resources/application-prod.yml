spring:
  config:
    activate:
      on-profile: prod

  datasource:
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      "[hibernate.format_sql]": false

app:
  jwt:
    secret: ${JWT_SECRET}
