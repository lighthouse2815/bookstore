spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: bookstore

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bookstore_db}
    username: ${DB_USER:bookstore_user}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      "[hibernate.format_sql]": true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:01234567890123456789012345678901}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  otp:
    expiration-minutes: ${OTP_EXPIRATION_MINUTES:10}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
    resend-max-requests-per-window: ${OTP_RESEND_MAX_REQUESTS_PER_WINDOW:5}
    resend-window-minutes: ${OTP_RESEND_WINDOW_MINUTES:15}
  resend:
    base-url: ${RESEND_BASE_URL:https://api.resend.com}
    api-key: ${RESEND_API_KEY:}
    from-email: ${RESEND_FROM_EMAIL:}
    from-name: ${RESEND_FROM_NAME:Bookstore}
  sepay:
    merchant-id: ${SEPAY_MERCHANT_ID:}
    secret-key: ${SEPAY_SECRET_KEY:}
    webhook-api-key: ${SEPAY_WEBHOOK_API_KEY:}
