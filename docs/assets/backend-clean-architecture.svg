<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="830" viewBox="0 0 1320 830" role="img" aria-labelledby="title desc">
  <title id="title">Bốn lớp backend Bookstore</title>
  <desc id="desc">Presentation gọi Application. Application điều phối domain và dùng infrastructure cho MySQL hay hệ thống ngoài. Domain không phụ thuộc HTTP, Spring hay JPA.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#f0fdfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .layer { font: 700 25px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .body { font: 400 17px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .note { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .arrow { fill: none; stroke: #475569; stroke-width: 3.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1320" height="830" fill="url(#background)"/>
  <text x="70" y="72" class="title">Bốn lớp backend: từ HTTP đến dữ liệu</text>
  <text x="70" y="106" class="subtitle">Đọc theo mũi tên khi lần request; giữ business rule và chi tiết kỹ thuật ở đúng lớp.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="160" width="510" height="142" rx="22" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
    <rect x="70" y="345" width="510" height="180" rx="22" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="2"/>
    <rect x="70" y="568" width="510" height="145" rx="22" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
    <rect x="750" y="345" width="500" height="240" rx="22" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
    <rect x="750" y="640" width="500" height="88" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>

  <text x="106" y="207" class="layer">Presentation</text>
  <text x="106" y="240" class="body">Controller · Request/Response DTO · Web mapper</text>
  <text x="106" y="269" class="body">HTTP validation · ApiResponse · exception handler</text>

  <text x="106" y="392" class="layer">Application</text>
  <text x="106" y="425" class="body">Port in/out · Command/Query/Result · Service</text>
  <text x="106" y="454" class="body">Transaction · ownership · phối hợp nhiều aggregate</text>
  <text x="106" y="483" class="body">Assembler · use case như checkout, cancel, refund</text>

  <text x="106" y="615" class="layer">Domain</text>
  <text x="106" y="648" class="body">Model · Enum · invariant · DomainException</text>
  <text x="106" y="677" class="body">Order, Payment, Book, User… không phụ thuộc Spring/JPA</text>

  <text x="786" y="392" class="layer">Infrastructure</text>
  <text x="786" y="425" class="body">JPA entity/repository/adapter · Security · WebSocket</text>
  <text x="786" y="454" class="body">Email Resend · SePay · R2/S3 · Outbox · Workers AI</text>
  <text x="786" y="483" class="body">Cài đặt chi tiết kỹ thuật cho các port out</text>
  <text x="786" y="540" class="note">Adapter chuyển domain model ↔ JPA entity hoặc provider ngoài</text>

  <text x="786" y="677" class="layer">MySQL và hệ thống ngoài</text>
  <text x="786" y="708" class="body">Persistence, storage, payment, email, AI</text>

  <path d="M325 302 V345" class="arrow"/>
  <path d="M325 525 V568" class="arrow"/>
  <path d="M580 435 H750" class="arrow"/>
  <path d="M1000 585 V640" class="arrow"/>

  <text x="358" y="330" class="note">Controller gọi port in</text>
  <text x="358" y="555" class="note">Service áp dụng rule domain</text>
  <text x="613" y="414" class="note">Application dùng port out</text>
  <text x="1033" y="618" class="note">Đọc/ghi hoặc gọi provider</text>

  <rect x="70" y="760" width="1180" height="42" rx="12" fill="#0f172a"/>
  <text x="98" y="788" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#f8fafc">Nguyên tắc: controller không gọi JPA trực tiếp; client không quyết định rule/permission; thay đổi schema đi qua Flyway migration.</text>
</svg>
