<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Tổng quan kiến trúc hệ thống Bookstore</title>
  <desc id="desc">Bốn client Website, Android, Desktop POS và Ship app gọi Spring Boot backend. Backend kết nối MySQL và các dịch vụ R2/S3, SePay, Resend, Cloudflare Workers AI.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .label { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .detail { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .small { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #64748b; }
      .line { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1440" height="760" fill="url(#background)"/>
  <text x="72" y="74" class="title">Tổng quan hệ thống Bookstore</text>
  <text x="72" y="108" class="subtitle">Backend là trung tâm nghiệp vụ; mọi client dùng cùng API và quy tắc dữ liệu.</text>

  <g filter="url(#shadow)">
    <rect x="72" y="175" width="245" height="100" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="72" y="305" width="245" height="100" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="72" y="435" width="245" height="100" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="72" y="565" width="245" height="100" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>

    <rect x="525" y="275" width="385" height="278" rx="24" fill="#0f766e"/>

    <rect x="1115" y="150" width="250" height="82" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="1115" y="258" width="250" height="82" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="1115" y="366" width="250" height="82" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="1115" y="474" width="250" height="82" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="1115" y="582" width="250" height="82" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>

  <text x="104" y="215" class="label">Website</text>
  <text x="104" y="244" class="detail">React · Storefront · Admin</text>
  <text x="104" y="345" class="label">Android</text>
  <text x="104" y="374" class="detail">Kotlin · Jetpack Compose</text>
  <text x="104" y="475" class="label">Desktop POS</text>
  <text x="104" y="504" class="detail">WPF · Nhân viên tại quầy</text>
  <text x="104" y="605" class="label">Ship app</text>
  <text x="104" y="634" class="detail">Expo · Shipper</text>

  <text x="565" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Spring Boot Backend</text>
  <text x="565" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#ccfbf1">REST API · JWT/CSRF · WebSocket</text>
  <text x="565" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#ccfbf1">Order · Payment · Stock · Refund</text>
  <text x="565" y="444" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#ccfbf1">Auth · Outbox · Digital library</text>
  <text x="565" y="496" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#99f6e4">Java 21 · Spring Boot · JPA · Flyway</text>

  <text x="1146" y="185" class="label">MySQL 8</text>
  <text x="1146" y="211" class="detail">Dữ liệu nghiệp vụ</text>
  <text x="1146" y="293" class="label">R2 / S3</text>
  <text x="1146" y="319" class="detail">Ảnh và tài sản số</text>
  <text x="1146" y="401" class="label">SePay</text>
  <text x="1146" y="427" class="detail">IPN thanh toán</text>
  <text x="1146" y="509" class="label">Resend</text>
  <text x="1146" y="535" class="detail">Email OTP / reset</text>
  <text x="1146" y="617" class="label">Workers AI</text>
  <text x="1146" y="643" class="detail">Chat hỗ trợ tùy chọn</text>

  <path d="M317 225 H480 V330 H525" class="line"/>
  <path d="M317 355 H465 V380 H525" class="line"/>
  <path d="M317 485 H465 V430 H525" class="line"/>
  <path d="M317 615 H480 V480 H525" class="line"/>

  <path d="M910 335 H1035 V191 H1115" class="line"/>
  <path d="M910 375 H1020 V299 H1115" class="line"/>
  <path d="M910 415 H1010 V407 H1115" class="line"/>
  <path d="M910 455 H1020 V515 H1115" class="line"/>
  <path d="M910 495 H1035 V623 H1115" class="line"/>

  <text x="350" y="158" class="small">REST /api · WebSocket</text>
  <text x="942" y="703" class="small">Tích hợp ngoài được cấu hình bằng biến môi trường; không đặt secret vào client.</text>
</svg>
