name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bookstore-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run backend tests
        run: ./mvnw test

      - name: Compile backend
        run: ./mvnw -DskipTests compile

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bookstore-website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install website dependencies
        run: npm install

      - name: Lint website
        run: npm run lint

      - name: Build website
        run: npm run build

  shipapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bookstore-shipapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ship app dependencies
        run: npm install

      - name: Typecheck ship app
        run: npm run typecheck

  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: bookstore-desktop/Bookstore.Desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore desktop project
        run: dotnet restore

      - name: Build desktop project
        run: dotnet build --configuration Release --no-restore

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bookstore-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Assemble mobile debug build
        run: ./gradlew assembleDebug
