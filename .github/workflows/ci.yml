name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      website: ${{ steps.filter.outputs.website }}
      shipapp: ${{ steps.filter.outputs.shipapp }}
      desktop: ${{ steps.filter.outputs.desktop }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed applications
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'bookstore-backend/**'
              - '.github/workflows/**'
            website:
              - 'bookstore-website/**'
              - '.github/workflows/**'
            shipapp:
              - 'bookstore-shipapp/**'
              - '.github/workflows/**'
            desktop:
              - 'bookstore-desktop/**'
              - '.github/workflows/**'
            mobile:
              - 'bookstore-mobile/**'
              - '.github/workflows/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bookstore-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run backend tests
        run: ./mvnw test

      - name: Compile backend
        run: ./mvnw -DskipTests compile

      - name: Run MySQL concurrency tests
        run: ./mvnw -Ptestcontainers verify

  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bookstore-website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable Corepack
        run: corepack enable

      - name: Install website dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint website
        run: pnpm lint

      - name: Test website
        run: pnpm test

      - name: Build website
        run: pnpm build

  shipapp:
    needs: changes
    if: needs.changes.outputs.shipapp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:8080/api
    defaults:
      run:
        working-directory: bookstore-shipapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bookstore-shipapp/package-lock.json

      - name: Install ship app dependencies
        run: npm ci

      - name: Test ship app
        run: npm run test

      - name: Typecheck ship app
        run: npm run typecheck

      - name: Export ship app for Android
        run: npx expo export --platform android

      - name: Upload Android export
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shipapp-android-export
          path: bookstore-shipapp/dist
          if-no-files-found: error
          retention-days: 7

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bookstore-desktop/Bookstore.Desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK and runtime 8.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore desktop solution
        run: dotnet restore

      - name: Run desktop tests
        run: dotnet test --configuration Release

      - name: Build desktop solution
        run: dotnet build --configuration Release --no-restore

      - name: Publish desktop win-x64
        run: dotnet publish Bookstore.Desktop.csproj --configuration Release --runtime win-x64 --self-contained false --output ./publish

      - name: Upload desktop publish
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bookstore-desktop-win-x64
          path: bookstore-desktop/Bookstore.Desktop/publish
          if-no-files-found: error
          retention-days: 7

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: bookstore-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run mobile unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble mobile debug build
        run: ./gradlew assembleDebug

      - name: Assemble mobile release build
        run: ./gradlew assembleRelease

      - name: Upload mobile debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bookstore-mobile-debug-apk
          path: bookstore-mobile/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
